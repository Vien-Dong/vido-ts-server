<!DOCTYPE html>
<html lang="vi">
<head>
<style>
.horse {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 160px;
  animation: bounce 1.5s infinite ease-in-out;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-15px);
  }
}
</style>
</head>
<body>

<img src="hehehe.webp" class="horse" alt="Cute horse">

</body>
</html>
